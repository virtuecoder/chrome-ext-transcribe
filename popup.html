<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>YouTube Transcribe — summary model</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 12px; width: 280px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 8px 0; }
  #current { font-weight: 600; overflow-wrap: anywhere; }
  select { width: 100%; margin: 4px 0 8px; padding: 4px; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 5px 0; cursor: pointer; }
  #status { min-height: 18px; color: #555; overflow-wrap: anywhere; }
  #status.error { color: #b00020; }
  #status.ok { color: #2e7d32; }
</style>
</head>
<body>
<h1>Summary model</h1>
<p>Current: <span id="current">loading…</span></p>
<label for="model">Free models (via Pi + Cline):</label>
<select id="model"></select>
<div class="row">
  <button id="refresh" type="button">Refresh</button>
  <button id="save" type="button">Use selected</button>
</div>
<p id="status"></p>
<script src="popup.js"></script>
</body>
</html>
